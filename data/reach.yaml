# Watch points for `python -m df_llm_helper reach` (spec v3-11).
# EXAMPLE VALUES from run 5 (Windrings, J110) - replace them for every new fortress (bau owns all coordinates).
# Fields: name, xyz [x, y, z], cat (farm|kitchen|still|well|hospital|barracks|depot|workshop|storage|crypt|...),
#         optional mandatory: true|false (default: cat listed in reach.mandatory), optional: true (never mandatory),
#         optional adjacent: true (the point is a building tile that blocks walking, e.g. a well: it counts as reached
#         when a tile next to it is; the Lua check does this by itself for any building tile, the flag also covers grids).
# Not yet listed (coordinates unknown in the run notes): crypt, food/wood/ore stockpiles, smelter.
