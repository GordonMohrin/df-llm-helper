# Curated knowledge entries (reviewed). Sources: SPEC appendix A, CLAUDE.md, POSTMORTEMs, orchestrator session Run 5.
- id: e18_pick
  title: "E18: miners do not pick up pickaxes"
  symptom_keywords: [pickaxe, pick, e18, dig jobs, work_weapons, miner does not dig, tool]
  ursache: "Only dwarves with a brought/assigned pick dig; free picks (often foreign=true from the wagon) are not picked up. work_weapons stays small."
  fix: "Militia squad 'Miners' (leader: claude/mil create <name> <id> --apply), claude/mil add <squad> <id> --apply, claude/mil workmode <squad> on --apply (uniform = pick only, labor MINE, group Miners). Verify: work_weapons/diggers rise within <= 90 s. Do not run workmode repeatedly (it wipes assignments). Runbook rb01_e18_pick."
  quelle: "SPEC appendix A1; session Run 5 (12 interventions 07:04-08:50)"
  run: 5
  scopes: [erkundung, bau, militaer, wirtschaft]
- id: e18_release
  title: "E18: pick assigned but not picked up (stale assignment)"
  symptom_keywords: [pick holder nil, removed_assignments 0, items_assigned, stale, workmode has no effect]
  ursache: "Old item IDs are still listed in squad.positions[].equipment.assigned_items and plotinfo.equipment.items_assigned.WEAPON."
  fix: "Move the IDs to items_unassigned.WEAPON, then run workmode exactly ONCE more, wait 60-90 s, check work_weapons. 'mil update' alone does nothing. Run 5: 4 of 5 picks fixed this way. Touching equipment data is an orchestrator decision."
  quelle: "Session Run 5; memory reference_df_e18_miliz_picken"
  run: 5
  scopes: [militaer, erkundung]
