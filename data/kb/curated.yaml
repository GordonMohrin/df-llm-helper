- id: wasser_diagonal
  title: "Water flows diagonally: access to the riverbank floods the tunnel"
  symptom_keywords: [water, flood, tunnel, bank, river, diagonal, emergency wall, flooding]
  ursache: "Dwarf Fortress lets water flow DIAGONALLY between two rock edges. Run 5: access tile (184,43,z128) diagonal to river water (185,42) -> tunnel W filled up (~40 tiles, ~110 units)."
  fix: "First run 'python -m df_llm_helper water check x y z' (forbidden = do not dig). On a flood immediately build an emergency wall (construction wall) between the front and the fort: runbook rb21_flut; never reopen the wall; dig ban water.forbid_dig."
  quelle: "LAYOUT-run5.md section 11 (incident Y106 Limestone 9)"
  run: 5
  scopes: [bau, erkundung, infra]
- id: perf_hanger
  title: "Game freezes every few seconds (periodic hang)"
  symptom_keywords: [freeze, hang, hangs, stutter, latency, outlier, slow, perf, raster, kohle, erzdig, reapply, timeout]
  ursache: "Run 5: a repeat-util job with a map scan (claude/raster reapply + erzdig ALL every 1500 ticks, claude/kohle 9.4 s, bauprog 3.5 s) froze the game ~11 s every ~25 s. Period ~ interval in ticks / tick rate; timestream raises the tick rate, so the hangs come more often."
  fix: "python -m df_llm_helper perf sample (outliers, max, period) -> python -m df_llm_helper perf bisect (finds the job; protected watchdog/milguard only in peace, < 40 s). Then raise the interval, split the scan into blocks or run it only on demand; never patch Lua automatically. Run perf sample after every Lua update."
  quelle: "Spec v3-03, Run 5 Y109 (diagnosis by hand took 15 turns)"
  run: 5
  scopes: [infra, auslastung]
