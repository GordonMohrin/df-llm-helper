id: rb05_waechter_blind
title: "Guard blind: last-report-id larger than the highest report"
needs_player_approval: false
kb: [waechter_blind]
symptom:
  when: "last_report_id is not None and max_report_id is not None and max_report_id >= 0 and last_report_id > max_report_id"
  confidence: 0.9
  explain: "last-report-id {last_report_id} > max {max_report_id}"
  signals:
    - {when: "events_age_min is None or events_age_min > 30", add: 0.05, why: "events.log is not growing"}
steps:
  - {action: reset_report_id}
  - {manual: "Restart the watcher 'python -m df_llm_helper waechter --loop' as an independent process (Invoke-CimMethod Win32_Process Create, see MANUAL 1); Start-Process -WindowStyle Hidden dies"}
verify:
  when: "last_report_id is not None and max_report_id is not None and last_report_id <= max_report_id"
  timeout_s: 30
