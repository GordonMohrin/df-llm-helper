# Camera profile 'build' (spec v3-10): buildings under construction and finished buildings.
name: build
extends: ambient
description: "focus on buildings under construction and completions"
mode: auto
job_weights:
  - {p: "^ConstructBuilding", w: 10, cat: build}
  - {p: "^Construct", w: 8, cat: furniture}
  - {p: "^DestroyBuilding", w: 5, cat: build}
  - {p: "^Smooth", w: 3, cat: dig}
  - {p: "^Engrave", w: 3, cat: craft}
  - {p: "^Dig", w: 2, cat: dig}
  - {p: "^Carve", w: 2, cat: dig}
  - {p: "^PlaceItemInTomb", w: 2, cat: burial}
  - {p: "^Spar", w: 0, cat: sparring}
  - {p: "^Store", w: 0.5, cat: haul}
  - {p: "^Haul", w: 0.5, cat: haul}
  - {p: "^Sleep", w: 0, cat: rest}
  - {p: "^Rest", w: 0, cat: rest}
  - {p: "^Eat", w: 0, cat: rest}
  - {p: "^Drink", w: 0, cat: rest}
default_weight: 0.5
